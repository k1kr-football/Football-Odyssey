<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#051C14" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE259" />
      <stop offset="100%" stop-color="#FFA751" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00FF88" />
      <stop offset="100%" stop-color="#00B862" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Card -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />

  <!-- Outer Neon Glow Ring -->
  <rect x="24" y="24" width="464" height="464" rx="88" fill="none" stroke="url(#accentGrad)" stroke-width="6" opacity="0.4" />

  <!-- Trophy Silhouette & Football Graphic -->
  <g transform="translate(256, 230)" filter="url(#glow)">
    <!-- Trophy Cup -->
    <path d="M -70 -110 L 70 -110 C 70 -30 45 30 0 50 C -45 30 -70 -30 -70 -110 Z" fill="url(#goldGrad)" />
    <!-- Trophy Handles -->
    <path d="M -70 -90 C -110 -90 -110 -20 -60 0 C -65 -20 -65 -70 -70 -90 Z" fill="url(#goldGrad)" opacity="0.85" />
    <path d="M 70 -90 C 110 -90 110 -20 60 0 C 65 -20 65 -70 70 -90 Z" fill="url(#goldGrad)" opacity="0.85" />
    <!-- Stem & Base -->
    <rect x="-18" y="50" width="36" height="45" fill="url(#goldGrad)" />
    <path d="M -50 95 L 50 95 L 60 125 L -60 125 Z" fill="url(#goldGrad)" />
    
    <!-- Soccer Ball emblem overlay -->
    <circle cx="0" cy="-45" r="32" fill="#FFFFFF" />
    <polygon points="0,-60 14,-49 9,-33 -9,-33 -14,-49" fill="#111827" />
    <line x1="0" y1="-60" x2="0" y2="-77" stroke="#111827" stroke-width="3" />
    <line x1="14" y1="-49" x2="28" y2="-55" stroke="#111827" stroke-width="3" />
    <line x1="9" y1="-33" x2="22" y2="-21" stroke="#111827" stroke-width="3" />
    <line x1="-9" y1="-33" x2="-22" y2="-21" stroke="#111827" stroke-width="3" />
    <line x1="-14" y1="-49" x2="-28" y2="-55" stroke="#111827" stroke-width="3" />
  </g>

  <!-- Star accents -->
  <path d="M 256 50 L 261 63 L 275 63 L 264 72 L 268 85 L 256 76 L 244 85 L 248 72 L 237 63 L 251 63 Z" fill="url(#accentGrad)" />
</svg>
